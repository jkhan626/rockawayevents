<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanks, we got it | Rockaway Events</title>
<meta name="description" content="Your event submission was received. We review every submission before it goes live.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBF6EC">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF6EC;--card:#FFFFFF;--line2:#D8CBB0;--tx:#16242F;--mu:#5C6670;
--ocean:#1F6F8B;--orange:#E2572B;--orange-deep:#C7481E;--glass:#2E8B6E;--glassbg:#DDF1E8;--sand:#C9A96E;
--dsp:'Plus Jakarta Sans',Inter,-apple-system,sans-serif;--sans:'Inter',-apple-system,sans-serif}
html{color-scheme:light}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:400 15px/1.6 var(--sans);min-height:100vh;
display:flex;align-items:center;justify-content:center;padding:28px 18px;-webkit-font-smoothing:antialiased}
.box{max-width:440px;text-align:center}
.tick{width:56px;height:56px;margin:0 auto 20px;border-radius:50%;
background:var(--glassbg);border:1px solid var(--glass);
display:flex;align-items:center;justify-content:center}
.tick svg{width:26px;height:26px;stroke:var(--glass);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
h1{font:700 clamp(26px,7vw,34px)/1.1 var(--dsp);letter-spacing:-.02em;margin-bottom:12px}
p{color:var(--mu);margin-bottom:14px}
p.em{color:#2C3D49}
a.btn{display:inline-block;margin-top:12px;background:var(--orange-deep);color:#fff;font-weight:600;
text-decoration:none;border-radius:999px;padding:12px 26px;font-size:15px}
a.btn:hover{filter:brightness(1.1)}
.alt{margin-top:20px;font-size:13.5px}
.alt a{color:var(--ocean);text-decoration:none}
.alt a:hover{text-decoration:underline}
.mark{font:700 18px/1 var(--dsp);color:var(--tx);text-decoration:none;display:block;margin-bottom:26px}
</style>
</head>
<body>
<div class="box">
  <a class="mark" href="/">Rockaway Events</a>
  <div class="tick"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg></div>
  <h1>Thanks, we got it</h1>
  <p class="em">Your event is in the queue. Somebody reads every submission, usually within a day, and then it shows up on the calendar.</p>
  <p>If we need to ask you something we will email you. Nothing else, ever.</p>
  <a class="btn" href="/">Back to events</a>
  <p class="alt"><a href="/submit/">Submit another</a> &nbsp;·&nbsp; <a href="mailto:hello@rockawayevents.org">hello@rockawayevents.org</a></p>
</div>
<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "03fa211dea804884a2459056af1cf81b"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
