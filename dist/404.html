<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Rockaway Events</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBF6EC">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF6EC;--tx:#16242F;--mu:#5C6670;--ocean:#1F6F8B;--orange:#E2572B;--orange-deep:#C7481E;--sand:#C9A96E;
--dsp:'Fraunces',Georgia,serif;--sans:'Inter',-apple-system,sans-serif}
html{color-scheme:light}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:400 15px/1.6 var(--sans);min-height:100vh;
display:flex;align-items:center;justify-content:center;padding:28px 18px;-webkit-font-smoothing:antialiased;text-align:center}
.mark{font:700 18px/1 var(--dsp);color:var(--tx);text-decoration:none;display:block;margin-bottom:26px}
.code{font:700 78px/1 var(--dsp);color:var(--orange-deep);letter-spacing:-.04em}
h1{font:700 clamp(24px,6.5vw,32px)/1.15 var(--dsp);letter-spacing:-.02em;margin:14px 0 12px}
p{color:var(--mu);max-width:30em;margin:0 auto 16px}
a.btn{display:inline-block;margin-top:10px;background:var(--orange-deep);color:#fff;font-weight:600;
text-decoration:none;border-radius:999px;padding:12px 26px;font-size:15px}
a.btn:hover{filter:brightness(1.1)}
.alt{margin-top:20px;font-size:13.5px}
.alt a{color:var(--ocean);text-decoration:none}
.alt a:hover{text-decoration:underline}
</style>
</head>
<body>
<div>
  <a class="mark" href="/">Rockaway Events</a>
  <div class="code">404</div>
  <h1>That page washed out</h1>
  <p>The link is wrong or the page is gone. The events list is still where it always is.</p>
  <a class="btn" href="/">Go to events</a>
  <p class="alt"><a href="/submit/">Submit an event</a> &nbsp;·&nbsp; <a href="mailto:hello@rockawayevents.org">hello@rockawayevents.org</a></p>
</div>
</body>
</html>
